<!--
  Logotipo de Wakea Travel.

  Ellos solo lo publican en PNG (blanco sobre transparente, en su web de Wix),
  así que este SVG es una vectorización de ese PNG: se separó el arte en sus dos
  tintas (el aro con el lettering y los aviones, y los continentes del globo) y
  se trazó cada una con potrace. Va horneado sobre su disco azul marino, que es
  como la marca se presenta en su propia web y lo que permite leerlo sobre fondo
  claro. Si algún día facilitan el vectorial original, basta con sustituir este
  fichero.
-->
